name: 듀얼 응원 APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Java 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Flutter 프로젝트 기본 구조 생성
        run: |
          flutter create \
            --org com.cheer.dual \
            --project-name cheer_dual \
            --platforms android \
            project

      - name: 소스 코드 생성
        run: |
          python3 << 'PYEOF'
          import os

          def w(path, content):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)

          # ── pubspec.yaml ──────────────────────────────────────
          w('project/pubspec.yaml', """name: cheer_dual
          description: 듀얼 태블릿 응원 앱
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            nearby_connections: ^4.0.0
            image_picker: ^1.0.7
            image: ^4.1.3
            permission_handler: ^11.3.0
            flutter_colorpicker: ^1.0.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
          """)

          # ── AndroidManifest.xml ───────────────────────────────
          w('project/android/app/src/main/AndroidManifest.xml', """<manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES"
                  android:usesPermissionFlags="neverForLocation"
                  tools:targetApi="tiramisu" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <application
                  android:label="듀얼 응원 앱"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:screenOrientation="landscape"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          """)

          # ── lib/main.dart ─────────────────────────────────────
          w('project/lib/main.dart', """import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'screens/home_screen.dart';
          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setPreferredOrientations([DeviceOrientation.landscapeLeft, DeviceOrientation.landscapeRight]);
            runApp(const CheerApp());
          }
          class CheerApp extends StatelessWidget {
            const CheerApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '듀얼 응원 앱',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0B0B15),
                  colorScheme: const ColorScheme.dark(primary: Color(0xFFFF6600), surface: Color(0xFF1A1A2E)),
                ),
                home: const HomeScreen(),
              );
            }
          }
          """)

          # ── lib/models/cheer_settings.dart ────────────────────
          w('project/lib/models/cheer_settings.dart', """import 'dart:convert';
          import 'package:flutter/material.dart';
          class CheerSettings {
            final String text, textColor, bgColor, fontFamily, direction, imageEffect, imagePosition;
            final double fontSize, speed, imageOpacity, imageSizePct;
            final bool scrolling, blinking;
            final int blinkSpeedMs, startTimeMs, version;
            final String? imageBase64;
            const CheerSettings({
              this.text = '대구 FC 파이팅! 🔥', this.textColor = '#FF6600', this.bgColor = '#000022',
              this.fontFamily = 'Impact', this.fontSize = 88, this.scrolling = true,
              this.direction = 'left', this.speed = 300, this.blinking = false,
              this.blinkSpeedMs = 600, this.imageBase64, this.imageEffect = 'none',
              this.imageOpacity = 1.0, this.imagePosition = 'after', this.imageSizePct = 60,
              this.startTimeMs = 0, this.version = 0,
            });
            factory CheerSettings.initial() => CheerSettings(startTimeMs: DateTime.now().millisecondsSinceEpoch);
            factory CheerSettings.fromJson(Map<String, dynamic> j) => CheerSettings(
              text: j['text'] ?? '', textColor: j['textColor'] ?? '#FF6600', bgColor: j['bgColor'] ?? '#000022',
              fontFamily: j['fontFamily'] ?? 'Impact', fontSize: (j['fontSize'] ?? 88).toDouble(),
              scrolling: j['scrolling'] ?? true, direction: j['direction'] ?? 'left',
              speed: (j['speed'] ?? 300).toDouble(), blinking: j['blinking'] ?? false,
              blinkSpeedMs: j['blinkSpeedMs'] ?? 600, imageBase64: j['imageBase64'],
              imageEffect: j['imageEffect'] ?? 'none', imageOpacity: (j['imageOpacity'] ?? 1.0).toDouble(),
              imagePosition: j['imagePosition'] ?? 'after', imageSizePct: (j['imageSizePct'] ?? 60).toDouble(),
              startTimeMs: j['startTimeMs'] ?? 0, version: j['version'] ?? 0,
            );
            Map<String, dynamic> toJson() => {
              'text': text, 'textColor': textColor, 'bgColor': bgColor, 'fontFamily': fontFamily,
              'fontSize': fontSize, 'scrolling': scrolling, 'direction': direction, 'speed': speed,
              'blinking': blinking, 'blinkSpeedMs': blinkSpeedMs, 'imageBase64': imageBase64,
              'imageEffect': imageEffect, 'imageOpacity': imageOpacity, 'imagePosition': imagePosition,
              'imageSizePct': imageSizePct, 'startTimeMs': startTimeMs, 'version': version,
            };
            String toJsonString() => jsonEncode(toJson());
            static CheerSettings fromJsonString(String s) => CheerSettings.fromJson(jsonDecode(s));
            CheerSettings copyWith({
              String? text, textColor, bgColor, fontFamily, direction, imageEffect, imagePosition, imageBase64,
              double? fontSize, speed, imageOpacity, imageSizePct, bool? scrolling, blinking, clearImage = false,
              int? blinkSpeedMs, startTimeMs, version,
            }) => CheerSettings(
              text: text ?? this.text, textColor: textColor ?? this.textColor, bgColor: bgColor ?? this.bgColor,
              fontFamily: fontFamily ?? this.fontFamily, fontSize: fontSize ?? this.fontSize,
              scrolling: scrolling ?? this.scrolling, direction: direction ?? this.direction,
              speed: speed ?? this.speed, blinking: blinking ?? this.blinking,
              blinkSpeedMs: blinkSpeedMs ?? this.blinkSpeedMs, imageBase64: clearImage ? null : (imageBase64 ?? this.imageBase64),
              imageEffect: imageEffect ?? this.imageEffect, imageOpacity: imageOpacity ?? this.imageOpacity,
              imagePosition: imagePosition ?? this.imagePosition, imageSizePct: imageSizePct ?? this.imageSizePct,
              startTimeMs: startTimeMs ?? this.startTimeMs, version: version ?? this.version,
            );
            Color get textColorValue => _hex(textColor);
            Color get bgColorValue => _hex(bgColor);
            static Color _hex(String h) => Color(int.parse('FF' + h.replaceAll('#', ''), radix: 16));
            static String colorToHex(Color c) => '#${c.red.toRadixString(16).padLeft(2, '0')}${c.green.toRadixString(16).padLeft(2, '0')}${c.blue.toRadixString(16).padLeft(2, '0')}';
            static const fontOptions = [{'label': 'Impact (굵음)', 'value': 'Impact'}, {'label': '맑은 고딕', 'value': 'MalgunGothic'}];
            TextStyle get displayTextStyle => TextStyle(fontFamily: fontFamily, fontWeight: FontWeight.w900, fontSize: fontSize, color: textColorValue, letterSpacing: 4, shadows: [Shadow(color: textColorValue.withOpacity(0.5), blurRadius: 30)]);
          }
          """)

          # ── lib/services/nearby_service.dart ──────────────────
          w('project/lib/services/nearby_service.dart', """import 'dart:async';
          import 'dart:typed_data';
          import 'package:nearby_connections/nearby_connections.dart';
          import '../models/cheer_settings.dart';
          enum ConnType { wifiDirect, bluetooth }
          enum TabletSide { left, right }
          class NearbyService {
            static const String _serviceId = 'com.cheer.dual.app';
            final ConnType connType; final TabletSide side;
            final _nearby = Nearby(); final _ids = <String>{};
            final _settingsCtrl = StreamController<CheerSettings>.broadcast();
            final _statusCtrl = StreamController<String>.broadcast();
            final _connCtrl = StreamController<int>.broadcast();
            Stream<CheerSettings> get settingsStream => _settingsCtrl.stream;
            Stream<String> get statusStream => _statusCtrl.stream;
            Stream<int> get connCountStream => _connCtrl.stream;
            NearbyService({required this.connType, required this.side});
            Future<void> start() async { side == TabletSide.left ? await _advertise() : await _discover(); }
            Future<void> _advertise() async {
              try {
                await _nearby.startAdvertising('왼쪽태블릿', Strategy.P2P_POINT_TO_POINT,
                  onConnectionInitiated: _onInit, onConnectionResult: _onResult,
                  onDisconnected: _onDisc, serviceId: _serviceId);
                _log('📶 대기 중...');
              } catch (e) { _log('❌ 에러: \$e'); }
            }
            Future<void> _discover() async {
              try {
                await _nearby.startDiscovery('오른쪽태블릿', Strategy.P2P_POINT_TO_POINT,
                  onEndpointFound: (id, name, _) async {
                    try { await _nearby.requestConnection('오른쪽태블릿', id, onConnectionInitiated: _onInit, onConnectionResult: _onResult, onDisconnected: _onDisc); } catch (_) {}
                  }, serviceId: _serviceId);
                _log('🔍 검색 중...');
              } catch (e) { _log('❌ 에러: \$e'); }
            }
            void _onInit(String id, ConnectionInfo info) { _nearby.acceptConnection(id, onPayLoadRecieved: _onPayload, onPayloadTransferUpdate: (_, __) {}); }
            void _onResult(String id, Status status) {
              if (status == Status.CONNECTED) _ids.add(id); else _ids.remove(id);
              _connCtrl.add(_ids.length);
            }
            void _onDisc(String id) { _ids.remove(id); _connCtrl.add(_ids.length); }
            void _onPayload(String _, Payload p) {
              if (p.type == PayloadType.BYTES && p.bytes != null) {
                try { _settingsCtrl.add(CheerSettings.fromJsonString(String.fromCharCodes(p.bytes!))); } catch (_) {}
              }
            }
            Future<bool> sendSettings(CheerSettings s) async {
              final bytes = Uint8List.fromList(s.toJsonString().codeUnits);
              for (final id in _ids) { try { await _nearby.sendBytesPayload(id, bytes); } catch (_) {} }
              return _ids.isNotEmpty;
            }
            void dispose() { _nearby.stopAllEndpoints(); _settingsCtrl.close(); _statusCtrl.close(); _connCtrl.close(); }
            void _log(String m) { if (!_statusCtrl.isClosed) _statusCtrl.add(m); }
          }
          """)

          # ── lib/services/image_processor.dart ─────────────────
          w('project/lib/services/image_processor.dart', """import 'dart:math';
          import 'dart:typed_data';
          import 'package:image/image.dart' as img;
          class ImageProcessor {
            static Future<Uint8List> compress(Uint8List raw) async {
              final d = img.decodeImage(raw); if (d == null) return raw;
              return Uint8List.fromList(img.encodeJpg(img.copyResize(d, width: 500), quality: 50));
            }
            static Future<Uint8List> sobelEdge(Uint8List raw) async {
              final d = img.decodeImage(raw); if (d == null) return raw;
              final out = img.sobel(img.grayscale(img.copyResize(d, width: 400)));
              return Uint8List.fromList(img.encodePng(out));
            }
          }
          """)

          # ── lib/screens/home_screen.dart ──────────────────────
          w('project/lib/screens/home_screen.dart', """import 'package:flutter/material.dart';
          import 'package:permission_handler/permission_handler.dart';
          import '../services/nearby_service.dart';
          import 'display_screen.dart';
          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override State<HomeScreen> createState() => _HomeScreenState();
          }
          class _HomeScreenState extends State<HomeScreen> {
            TabletSide? _side; ConnType _conn = ConnType.wifiDirect;
            Future<void> _start() async {
              await [Permission.location, Permission.nearbyWifiDevices, Permission.bluetoothScan, Permission.bluetoothConnect, Permission.bluetoothAdvertise].request();
              if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => DisplayScreen(service: NearbyService(connType: _conn, side: _side!), side: _side!)));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                  const Text('⚽ 듀얼 응원 앱', style: TextStyle(fontSize: 32, fontWeight: FontWeight.bold, color: Color(0xFFFF6600))),
                  const SizedBox(height: 40),
                  Row(mainAxisAlignment: MainAxisAlignment.center, children: [
                    ElevatedButton(onPressed: () => setState(() => _side = TabletSide.left), style: ElevatedButton.styleFrom(backgroundColor: _side == TabletSide.left ? Colors.blue : Colors.grey), child: const Text('왼쪽')),
                    const SizedBox(width: 20),
                    ElevatedButton(onPressed: () => setState(() => _side = TabletSide.right), style: ElevatedButton.styleFrom(backgroundColor: _side == TabletSide.right ? Colors.orange : Colors.grey), child: const Text('오른쪽')),
                  ]),
                  const SizedBox(height: 40),
                  ElevatedButton(onPressed: _side != null ? _start : null, child: const Text('시작하기')),
                ])),
              );
            }
          }
          """)

          # ── lib/screens/display_screen.dart ───────────────────
          w('project/lib/screens/display_screen.dart', """import 'dart:async';
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import '../models/cheer_settings.dart';
          import '../services/nearby_service.dart';
          class DisplayScreen extends StatefulWidget {
            final NearbyService service; final TabletSide side;
            const DisplayScreen({super.key, required this.service, required this.side});
            @override State<DisplayScreen> createState() => _DisplayScreenState();
          }
          class _DisplayScreenState extends State<DisplayScreen> with TickerProviderStateMixin {
            CheerSettings _s = CheerSettings.initial();
            double _scrollPos = 0;
            @override
            void initState() {
              super.initState();
              widget.service.settingsStream.listen((s) => setState(() => _s = s));
              createTicker((_) {
                if (!_s.scrolling) return;
                setState(() { _scrollPos -= _s.speed / 60; if (_scrollPos < -2000) _scrollPos = 2000; });
              }).start();
              widget.service.start();
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: _s.bgColorValue,
                body: Stack(children: [
                  Positioned(left: _scrollPos, top: 0, bottom: 0, child: Center(child: Text(_s.text, style: _s.displayTextStyle))),
                  if (widget.side == TabletSide.left) Positioned(bottom: 20, right: 20, child: FloatingActionButton(onPressed: () {}, child: const Icon(Icons.settings))),
                ]),
              );
            }
          }
          """)

          print("✅ 모든 소스 파일 생성 완료!")
          PYEOF

      - name: 패키지 설치
        run: cd project && flutter pub get

      - name: APK 빌드
        run: |
          cd project
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --no-shrink

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 듀얼응원앱-APK
          path: project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
