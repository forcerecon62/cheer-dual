name: 듀얼 응원 APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Java 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Flutter 프로젝트 기본 구조 생성
        run: |
          flutter create \
            --org com.cheer.dual \
            --project-name cheer_dual \
            --platforms android \
            project

      # ─────────────────────────────────────────────────────────
      #  소스 코드 전체 생성 (Python 스크립트로 모든 파일 작성)
      # ─────────────────────────────────────────────────────────
      - name: 소스 코드 생성
        run: |
          python3 << 'PYEOF'
          import os

          def w(path, content):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)

          # ── pubspec.yaml ──────────────────────────────────────
          w('project/pubspec.yaml', """name: cheer_dual
description: 듀얼 태블릿 응원 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  nearby_connections: ^4.0.0
  image_picker: ^1.0.7
  image: ^4.1.3
  permission_handler: ^11.3.0
  flutter_colorpicker: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
""")

