          Row(children: [
            _RoleCard(sym:'◀', title:'왼쪽 태블릿', desc:'먼저 시작(HOST)',
              color:const Color(0xFF3366FF), active:_side==TabletSide.left,
              onTap:()=>setState(()=>_side=TabletSide.left)),
            const SizedBox(width: 12),
            _RoleCard(sym:'▶', title:'오른쪽 태블릿', desc:'나중에 시작(CLIENT)',
              color:_orange, active:_side==TabletSide.right,
              onTap:()=>setState(()=>_side=TabletSide.right)),
          ]),
          const SizedBox(height: 24),
          Container(
            padding: const EdgeInsets.all(16),
            decoration: BoxDecoration(color: const Color(0xFF111120),
              borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.white10)),
            child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
              Text('💡 사용 순서', style: TextStyle(color:Colors.grey[400], fontWeight:FontWeight.bold, fontSize:13)),
              const SizedBox(height: 8),
              ...['1. 왼쪽 태블릿 먼저 시작','2. 오른쪽 태블릿 시작 (자동 연결)',
                  '3. 연결 후 화면 탭 → 컨트롤러 열림','4. 설정 후 전송 버튼으로 동기화']
                .map((s) => Padding(padding: const EdgeInsets.only(bottom:3),
                  child: Text(s, style: TextStyle(color:Colors.grey[600], fontSize:12)))),
            ]),
