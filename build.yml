import '../models/cheer_settings.dart';
import '../services/nearby_service.dart';
import '../services/image_processor.dart';

class DisplayScreen extends StatefulWidget {
  final NearbyService service;
  final TabletSide side;
  const DisplayScreen({super.key, required this.service, required this.side});
  @override State<DisplayScreen> createState() => _DisplayScreenState();
}

class _DisplayScreenState extends State<DisplayScreen> with TickerProviderStateMixin {
  CheerSettings _s = CheerSettings.initial();
  late AnimationController _panelCtrl;
  late Animation<Offset> _panelSlide;
  bool _panelOpen = false;
  late Ticker _ticker;
  double _scrollPos = 0, _contentW = 600;
  final _contentKey = GlobalKey();
  bool _blinkOn = true;
  Timer? _blinkTimer;
  int _connCount = 0;
  String _statusMsg = '연결 중...';
  StreamSubscription? _sSub, _stSub, _cSub;

  @override
  void initState() {
    super.initState();
    _panelCtrl = AnimationController(vsync:this, duration:const Duration(milliseconds:300));
    _panelSlide = Tween<Offset>(begin:const Offset(0,1), end:Offset.zero)
        .animate(CurvedAnimation(parent:_panelCtrl, curve:Curves.easeOutCubic));
    _ticker = createTicker(_onTick)..start();
    _sSub = widget.service.settingsStream.listen((s) { setState(()=>_s=s); _resetBlink(); });
    _stSub = widget.service.statusStream.listen((m) => setState(()=>_statusMsg=m));
    _cSub = widget.service.connCountStream.listen((c) => setState(()=>_connCount=c));
    widget.service.start();
    SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
  }

  @override
  void dispose() {
    _panelCtrl.dispose(); _ticker.dispose(); _blinkTimer?.cancel();
    _sSub?.cancel(); _stSub?.cancel(); _cSub?.cancel();
    widget.service.dispose();
    super.dispose();
  }

  void _onTick(Duration _) {
    if (!_s.scrolling || !mounted) return;
    final W = MediaQuery.of(context).size.width;
    final total = W * 2;
    final travel = total + _contentW + 40;
    final elapsed = (DateTime.now().millisecondsSinceEpoch - _s.startTimeMs) / 1000.0;
    final dist = (elapsed * _s.speed) % travel;
    final absX = _s.direction == 'left' ? total + 20 - dist : dist - _contentW - 20;
    setState(() => _scrollPos = absX - (widget.side == TabletSide.right ? W : 0));
  }

  void _resetBlink() {
    _blinkTimer?.cancel();
    if (!_s.blinking) { setState(()=>_blinkOn=true); return; }
    _blinkTimer = Timer.periodic(Duration(milliseconds:_s.blinkSpeedMs),
        (_) => setState(()=>_blinkOn=!_blinkOn));
  }

  double _staticX(double W) {
    final c = W - _contentW / 2;
    return widget.side == TabletSide.right ? c - W : c;
  }

  void _measure() {
    WidgetsBinding.instance.addPostFrameCallback((_) {
      final w = _contentKey.currentContext?.size?.width ?? _contentW;
      if (w > 0 && w != _contentW) setState(()=>_contentW=w);
    });
  }

  void _togglePanel() {
    setState(()=>_panelOpen=!_panelOpen);
    _panelOpen ? _panelCtrl.forward() : _panelCtrl.reverse();
  }

  Future<void> _apply(CheerSettings next) async {
    setState(()=>_s=next); _resetBlink();
    await widget.service.sendSettings(next);
  }

  @override
  Widget build(BuildContext context) {
    _measure();
    final W = MediaQuery.of(context).size.width;
    final xPos = _s.scrolling ? _scrollPos : _staticX(W);
    return Scaffold(
      backgroundColor: _s.bgColorValue,
      body: GestureDetector(
        behavior: HitTestBehavior.opaque,
        onTap: _panelOpen ? null : _togglePanel,
        child: Stack(children: [
          Positioned(left:-99999, top:0, child:_Content(key:_contentKey, s:_s)),
          ClipRect(child: SizedBox.expand(child: Opacity(opacity:_blinkOn?1.0:0.0,
            child: Stack(children: [
              Positioned(left:xPos, top:0, bottom:0, child:Center(child:_Content(s:_s))),
            ])))),
          Positioned(top:12, left:12, child:_Badge(side:widget.side, conn:_connCount, msg:_statusMsg)),
          if (_connCount==0 && !_panelOpen) IgnorePointer(child:Center(child:Column(
            mainAxisSize:MainAxisSize.min, children:[
              Text(widget.side==TabletSide.left ? '📡 오른쪽 태블릿 연결 대기 중...' : '🔍 왼쪽 태블릿 검색 중...',
                style:TextStyle(color:Colors.white.withOpacity(0.25), fontSize:16, fontWeight:FontWeight.bold)),
              const SizedBox(height:6),
              Text('화면을 탭하면 컨트롤러 열림',
                style:TextStyle(color:Colors.white.withOpacity(0.15), fontSize:12)),
            ]))),
          SlideTransition(position:_panelSlide, child:Align(alignment:Alignment.bottomCenter,
            child:_Panel(settings:_s, conn:_connCount, onClose:_togglePanel, onApply:_apply))),
        ])));
  }
}

class _Content extends StatelessWidget {
  final CheerSettings s;
  const _Content({super.key, required this.s});
  @override Widget build(BuildContext context) {
    final imgH = MediaQuery.of(context).size.height * (s.imageSizePct/100);
    Widget? imgW;
    if (s.imageBase64 != null) {
      imgW = Opacity(opacity:s.imageOpacity, child: Image.memory(
        base64Decode(s.imageBase64!), height:imgH, fit:BoxFit.contain));
    }
    return Row(mainAxisSize:MainAxisSize.min, crossAxisAlignment:CrossAxisAlignment.center, children:[
      if (imgW!=null && s.imagePosition=='before') ...[imgW, const SizedBox(width:24)],
      Text(s.text, style:s.displayTextStyle),
      if (imgW!=null && s.imagePosition=='after') ...[const SizedBox(width:24), imgW],
    ]);
  }
}

