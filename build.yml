          # ── lib/models/cheer_settings.dart ────────────────────
          w('project/lib/models/cheer_settings.dart', """import 'dart:convert';
import 'package:flutter/material.dart';

class CheerSettings {
  final String text;
  final String textColor;
  final String bgColor;
  final String fontFamily;
  final double fontSize;
  final bool scrolling;
  final String direction;
  final double speed;
  final bool blinking;
  final int blinkSpeedMs;
  final String? imageBase64;
  final String imageEffect;
  final double imageOpacity;
  final String imagePosition;
  final double imageSizePct;
  final int startTimeMs;
  final int version;

  const CheerSettings({
    this.text = '대구 FC 파이팅! \uD83D\uDD25',
    this.textColor = '#FF6600',
    this.bgColor = '#000022',
    this.fontFamily = 'Impact',
    this.fontSize = 88,
    this.scrolling = true,
    this.direction = 'left',
    this.speed = 300,
    this.blinking = false,
    this.blinkSpeedMs = 600,
    this.imageBase64,
    this.imageEffect = 'none',
    this.imageOpacity = 1.0,
    this.imagePosition = 'after',
    this.imageSizePct = 60,
    this.startTimeMs = 0,
    this.version = 0,
  });

  factory CheerSettings.initial() => CheerSettings(
        startTimeMs: DateTime.now().millisecondsSinceEpoch,
      );

  factory CheerSettings.fromJson(Map<String, dynamic> j) => CheerSettings(
        text: (j['text'] as String?) ?? '대구 FC 파이팅! \uD83D\uDD25',
        textColor: (j['textColor'] as String?) ?? '#FF6600',
        bgColor: (j['bgColor'] as String?) ?? '#000022',
        fontFamily: (j['fontFamily'] as String?) ?? 'Impact',
        fontSize: ((j['fontSize'] as num?) ?? 88).toDouble(),
        scrolling: (j['scrolling'] as bool?) ?? true,
        direction: (j['direction'] as String?) ?? 'left',
        speed: ((j['speed'] as num?) ?? 300).toDouble(),
        blinking: (j['blinking'] as bool?) ?? false,
        blinkSpeedMs: (j['blinkSpeedMs'] as int?) ?? 600,
        imageBase64: j['imageBase64'] as String?,
        imageEffect: (j['imageEffect'] as String?) ?? 'none',
        imageOpacity: ((j['imageOpacity'] as num?) ?? 1.0).toDouble(),
        imagePosition: (j['imagePosition'] as String?) ?? 'after',
        imageSizePct: ((j['imageSizePct'] as num?) ?? 60).toDouble(),
        startTimeMs: (j['startTimeMs'] as int?) ?? DateTime.now().millisecondsSinceEpoch,
        version: (j['version'] as int?) ?? 0,
      );

  Map<String, dynamic> toJson() => {
        'text': text, 'textColor': textColor, 'bgColor': bgColor,
        'fontFamily': fontFamily, 'fontSize': fontSize,
        'scrolling': scrolling, 'direction': direction, 'speed': speed,
        'blinking': blinking, 'blinkSpeedMs': blinkSpeedMs,
        'imageBase64': imageBase64, 'imageEffect': imageEffect,
        'imageOpacity': imageOpacity, 'imagePosition': imagePosition,
        'imageSizePct': imageSizePct, 'startTimeMs': startTimeMs, 'version': version,
      };

  String toJsonString() => jsonEncode(toJson());
  static CheerSettings fromJsonString(String s) =>
      CheerSettings.fromJson(jsonDecode(s) as Map<String, dynamic>);

  CheerSettings copyWith({
    String? text, String? textColor, String? bgColor,
    String? fontFamily, double? fontSize, bool? scrolling,
    String? direction, double? speed, bool? blinking,
    int? blinkSpeedMs, String? imageBase64, bool clearImage = false,
    String? imageEffect, double? imageOpacity, String? imagePosition,
    double? imageSizePct, int? startTimeMs, int? version,
  }) => CheerSettings(
        text: text ?? this.text,
        textColor: textColor ?? this.textColor,
        bgColor: bgColor ?? this.bgColor,
        fontFamily: fontFamily ?? this.fontFamily,
        fontSize: fontSize ?? this.fontSize,
        scrolling: scrolling ?? this.scrolling,
        direction: direction ?? this.direction,
        speed: speed ?? this.speed,
        blinking: blinking ?? this.blinking,
        blinkSpeedMs: blinkSpeedMs ?? this.blinkSpeedMs,
        imageBase64: clearImage ? null : (imageBase64 ?? this.imageBase64),
        imageEffect: imageEffect ?? this.imageEffect,
        imageOpacity: imageOpacity ?? this.imageOpacity,
        imagePosition: imagePosition ?? this.imagePosition,
        imageSizePct: imageSizePct ?? this.imageSizePct,
        startTimeMs: startTimeMs ?? this.startTimeMs,
        version: version ?? this.version,
      );

  Color get textColorValue => _hex(textColor);
  Color get bgColorValue => _hex(bgColor);
  static Color _hex(String h) {
    final c = h.replaceAll('#', '').padLeft(6, '0');
    return Color(int.parse('FF\$c', radix: 16));
  }
  static String colorToHex(Color c) =>
      '#\${c.red.toRadixString(16).padLeft(2,'0')}'
      '\${c.green.toRadixString(16).padLeft(2,'0')}'
      '\${c.blue.toRadixString(16).padLeft(2,'0')}';

  static const List<Map<String, String>> fontOptions = [
    {'label': 'Impact (굵음)', 'value': 'Impact'},
    {'label': '맑은 고딕', 'value': 'MalgunGothic'},
    {'label': '바탕 (명조)', 'value': 'Batang'},
    {'label': '돋움', 'value': 'Dotum'},
    {'label': 'Sans-serif', 'value': 'sans-serif'},
  ];

  TextStyle get displayTextStyle => TextStyle(
        fontFamily: fontFamily,
        fontWeight: FontWeight.w900,
        fontSize: fontSize,
        color: textColorValue,
        letterSpacing: 4,
        shadows: [
          Shadow(color: textColorValue.withOpacity(0.5), blurRadius: 30),
        ],
      );
}
""")

          # ── lib/services/nearby_service.dart ──────────────────
          w('project/lib/services/nearby_service.dart', """import 'dart:async';
import 'dart:typed_data';
import 'package:nearby_connections/nearby_connections.dart';
import '../models/cheer_settings.dart';

enum ConnType { wifiDirect, bluetooth }
enum TabletSide { left, right }

class NearbyService {
  static const String _serviceId = 'com.cheer.dual.app';
  final ConnType connType;
  final TabletSide side;
  final _nearby = Nearby();
  final _ids = <String>{};
  final _settingsCtrl = StreamController<CheerSettings>.broadcast();
  final _statusCtrl = StreamController<String>.broadcast();
  final _connCtrl = StreamController<int>.broadcast();

  Stream<CheerSettings> get settingsStream => _settingsCtrl.stream;
  Stream<String> get statusStream => _statusCtrl.stream;
  Stream<int> get connCountStream => _connCtrl.stream;
  bool get isConnected => _ids.isNotEmpty;

  NearbyService({required this.connType, required this.side});

  Future<void> start() async {
    side == TabletSide.left ? await _advertise() : await _discover();
  }

  Future<void> _advertise() async {
    try {
      await _nearby.startAdvertising('왼쪽태블릿', Strategy.P2P_POINT_TO_POINT,
          onConnectionInitiated: _onInit,
          onConnectionResult: _onResult,
          onDisconnected: _onDisc,
          serviceId: _serviceId);
      _log(connType == ConnType.wifiDirect
          ? '📶 WiFi Direct 대기 중...' : '\uD83D\uDD35 Bluetooth 대기 중...');
    } catch (e) { _log('❌ 광고 실패: \$e'); }
  }

  Future<void> _discover() async {
    try {
      await _nearby.startDiscovery('오른쪽태블릿', Strategy.P2P_POINT_TO_POINT,
          onEndpointFound: (id, name, _) async {
            _log('발견: \$name → 연결 중...');
            try {
              await _nearby.requestConnection('오른쪽태블릿', id,
                  onConnectionInitiated: _onInit,
                  onConnectionResult: _onResult,
                  onDisconnected: _onDisc);
            } catch (e) { _log('연결 요청 실패: \$e'); }
          },
          onEndpointLost: (_) => _log('신호 끊김...'),
          serviceId: _serviceId);
      _log(connType == ConnType.wifiDirect
          ? '📶 WiFi Direct 검색 중...' : '\uD83D\uDD35 Bluetooth 검색 중...');
    } catch (e) { _log('❌ 검색 실패: \$e'); }
  }

  void _onInit(String id, ConnectionInfo info) {
    _log('연결 수락 중: \${info.endpointName}');
    _nearby.acceptConnection(id,
        onPayLoadRecieved: _onPayload,
        onPayloadTransferUpdate: (_, __) {});
  }

  void _onResult(String id, Status status) {
    if (status == Status.CONNECTED) {
      _ids.add(id);
      _log('✅ 연결 완료! (\${_ids.length}대)');
    } else {
      _ids.remove(id);
      _log('연결 실패');
    }
    _connCtrl.add(_ids.length);
  }

  void _onDisc(String id) {
    _ids.remove(id);
    _log('연결 해제 (\${_ids.length}대)');
    _connCtrl.add(_ids.length);
  }

  void _onPayload(String _, Payload p) {
    if (p.type == PayloadType.BYTES && p.bytes != null) {
      try {
        _settingsCtrl.add(CheerSettings.fromJsonString(String.fromCharCodes(p.bytes!)));
      } catch (_) {}
    }
  }

  Future<bool> sendSettings(CheerSettings s) async {
    if (_ids.isEmpty) { _log('⚠️ 연결된 기기 없음'); return false; }
    final bytes = Uint8List.fromList(s.toJsonString().codeUnits);
    int sent = 0;
    for (final id in Set.of(_ids)) {
      try { await _nearby.sendBytesPayload(id, bytes); sent++; } catch (_) {}
    }
    if (sent > 0) _log('📤 동기화 완료');
    return sent > 0;
  }

  Future<void> stop() async {
    try {
      await _nearby.stopAdvertising();
      await _nearby.stopDiscovery();
      await _nearby.stopAllEndpoints();
    } catch (_) {}
    _ids.clear();
    if (!_connCtrl.isClosed) _connCtrl.add(0);
  }

  void dispose() {
    stop();
    _settingsCtrl.close();
    _statusCtrl.close();
    _connCtrl.close();
  }

  void _log(String m) { if (!_statusCtrl.isClosed) _statusCtrl.add(m); }
}
""")

          # ── lib/services/image_processor.dart ─────────────────
          w('project/lib/services/image_processor.dart', """import 'dart:math';
import 'dart:typed_data';
import 'package:image/image.dart' as img;

class ImageProcessor {
  static Future<Uint8List> compress(Uint8List raw, {int quality=60, int max=700}) async {
    final d = img.decodeImage(raw);
    if (d == null) return raw;
    img.Image r = d;
    if (d.width > max || d.height > max) {
      final ratio = min(max / d.width, max / d.height);
      r = img.copyResize(d,
          width: (d.width*ratio).round(),
          height: (d.height*ratio).round(),
          interpolation: img.Interpolation.linear);
    }
    return Uint8List.fromList(img.encodeJpg(r, quality: quality));
  }

  static Future<Uint8List> sobelEdge(Uint8List raw, {int maxSz=550, double thr=22}) async {
    final d = img.decodeImage(raw);
    if (d == null) return raw;
    img.Image s = d;
    if (s.width > maxSz || s.height > maxSz) {
      final r = min(maxSz/s.width, maxSz/s.height);
      s = img.copyResize(d,
          width: (s.width*r).round(), height: (s.height*r).round(),
          interpolation: img.Interpolation.linear);
    }
    final w = s.width, h = s.height;
    final g = List<double>.filled(w*h, 0.0);
    for (int y=0; y<h; y++) for (int x=0; x<w; x++) {
      final p = s.getPixel(x, y);
      g[y*w+x] = 0.299*p.r + 0.587*p.g + 0.114*p.b;
    }
    final out = img.Image(width: w, height: h, numChannels: 4);
    for (int y=1; y<h-1; y++) for (int x=1; x<w-1; x++) {
      double p(int dy, int dx) => g[(y+dy)*w+(x+dx)];
      final gx = -p(-1,-1)+p(-1,1)-2*p(0,-1)+2*p(0,1)-p(1,-1)+p(1,1);
      final gy = -p(-1,-1)-2*p(-1,0)-p(-1,1)+p(1,-1)+2*p(1,0)+p(1,1);
      final mag = sqrt(gx*gx+gy*gy);
      if (mag > thr) out.setPixelRgba(x,y,255,255,255,255);
      else out.setPixelRgba(x,y,0,0,0,0);
    }
    return Uint8List.fromList(img.encodePng(out));
  }
}
""")

          # ── lib/screens/home_screen.dart ──────────────────────
          w('project/lib/screens/home_screen.dart', """import 'package:flutter/material.dart';
import 'package:permission_handler/permission_handler.dart';
import '../services/nearby_service.dart';
import 'display_screen.dart';

class HomeScreen extends StatefulWidget {
  const HomeScreen({super.key});
  @override State<HomeScreen> createState() => _HomeScreenState();
}

class _HomeScreenState extends State<HomeScreen> {
  TabletSide? _side;
  ConnType _conn = ConnType.wifiDirect;
  bool _loading = false;
  static const _orange = Color(0xFFFF6600);

  Future<void> _start() async {
    if (_side == null || _loading) return;
    setState(() => _loading = true);
    final perms = await [
      Permission.locationWhenInUse, Permission.nearbyWifiDevices,
      Permission.bluetoothScan, Permission.bluetoothConnect,
      Permission.bluetoothAdvertise, Permission.photos,
    ].request();
    final denied = perms.values.where((s) =>
        s == PermissionStatus.denied || s == PermissionStatus.permanentlyDenied);
    if (denied.isNotEmpty && mounted) {
      setState(() => _loading = false);
      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(
        content: Text('권한 거부됨 — 설정에서 허용 후 재시도'),
        backgroundColor: Colors.red));
      return;
    }
    if (!mounted) return;
    Navigator.pushReplacement(context, MaterialPageRoute(
      builder: (_) => DisplayScreen(
        service: NearbyService(connType: _conn, side: _side!),
        side: _side!)));
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: const Color(0xFF0B0B15),
      body: SafeArea(child: SingleChildScrollView(
        padding: const EdgeInsets.all(28),
        child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
          Row(children: [
            const Text('⚽', style: TextStyle(fontSize: 44)),
            const SizedBox(width: 16),
            Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
              const Text('듀얼 응원 앱',
                style: TextStyle(fontSize: 26, fontWeight: FontWeight.w900, color: _orange)),
              Text('인터넷 없이 WiFi Direct / Bluetooth 동기화',
                style: TextStyle(color: Colors.grey[600], fontSize: 12)),
            ]),
          ]),
          const SizedBox(height: 32),
          _lbl('연결 방식'),
          const SizedBox(height: 10),
          Row(children: [
            _ConnCard(icon:'📶', title:'WiFi Direct', desc:'빠름·이미지 유리',
              tip:'WiFi를 켜세요', active:_conn==ConnType.wifiDirect,
              onTap:()=>setState(()=>_conn=ConnType.wifiDirect)),
            const SizedBox(width: 12),
            _ConnCard(icon:'\uD83D\uDD35', title:'Bluetooth', desc:'안정적·약10m',
              tip:'블루투스를 켜세요', active:_conn==ConnType.bluetooth,
              onTap:()=>setState(()=>_conn=ConnType.bluetooth)),
          ]),
          const SizedBox(height: 28),
          _lbl('이 태블릿의 역할'),
