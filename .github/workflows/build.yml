          w('project/lib/screens/display_screen.dart', """
              import 'dart:async';
              import 'dart:convert';
              import 'dart:typed_data';
              import 'package:flutter/material.dart';
              import 'package:flutter/scheduler.dart';
              import 'package:flutter/services.dart';
              import 'package:flutter_colorpicker/flutter_colorpicker.dart';
              import 'package:image_picker/image_picker.dart';
              import '../models/cheer_settings.dart';
              import '../services/nearby_service.dart';
              import '../services/image_processor.dart';

              class DisplayScreen extends StatefulWidget {
                final NearbyService service;
                final TabletSide side;
                const DisplayScreen({super.key, required this.service, required this.side});
                @override
                State<DisplayScreen> createState() => _DS();
              }

              class _DS extends State<DisplayScreen> with TicketProviderStateMixin {
                CheerSettings _s = CheerSettings.initial();
                late AnimationController _pc;
                late Animation<Offset> _ps;
                bool _po = false;
                late Ticker _ticker;
                double _sp = 0;
                double _cw = 800;
                final _ck = GlobalKey();
                int _conn = 0;
                StreamSubscription? _ss, _cs;

                @override
                void initState() {
                  super.initState();
                  _pc = AnimationController(vsync: this, duration: const Duration(milliseconds: 300));
                  _ps = Tween<Offset>(begin: const Offset(0, 1), end: Offset.zero).animate(CurvedAnimation(parent: _pc, curve: Curves.easeOutCubic));
                  _ticker = createTicker(_tick)..start();
                  _ss = widget.service.settingsStream.listen((s) {
                    setState(() {
                      _s = _s.copyWith(
                        text: s.text, textColor: s.textColor, bgColor: s.bgColor,
                        fontSize: s.fontSize, scrolling: s.scrolling, direction: s.direction,
                        speed: s.speed, imageBase64: s.imageBase64, imageEffect: s.imageEffect,
                        imageOpacity: s.imageOpacity, imagePosition: s.imagePosition,
                        imageSizePct: s.imageSizePct, contentWidth: s.contentWidth,
                        repeatGap: s.repeatGap, strokeColor: s.strokeColor, strokeWidth: s.strokeWidth,
                        syncOffsetPx: s.syncOffsetPx, startTimeMs: s.startTimeMs, version: s.version,
                      );
                    });
                    _measure();
                  });
                  _cs = widget.service.connCountStream.listen((c) => setState(() => _conn = c));
                  widget.service.start();
                  SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
                }

                @override
                void dispose() {
                  _pc.dispose(); _ticker.dispose(); _ss?.cancel(); _cs?.cancel();
                  widget.service.dispose(); super.dispose();
                }

                void _tick(Duration _) {
                  if (!_s.scrolling || !mounted) return;
                  final W = MediaQuery.of(context).size.width;
                  final cw = _s.contentWidth > 50 ? _s.contentWidth : _cw;
                  final gap = _s.repeatGap;
                  final sync = _s.syncOffsetPx;

                  final cyc = cw + gap;
                  final elapsed = (DateTime.now().millisecondsSinceEpoch - _s.startTimeMs) / 1000.0;
                  final dist = (elapsed * _s.speed) % cyc;

                  double screenX;
                  if (_s.direction == 'left') {
                    double baseX = W - dist;
                    screenX = widget.side == TabletSide.left ? baseX : baseX - W - sync;
                  } else {
                    double baseX = dist - cw;
                    screenX = widget.side == TabletSide.left ? baseX : baseX - W - sync;
                  }
                  setState(() => _sp = screenX);
                }

                void _measure() {
                  WidgetsBinding.instance.addPostFrameCallback((_) {
                    final w = _ck.currentContext?.size?.width ?? _cw;
                    if (w > 50 && (w - _cw).abs() > 1) setState(() => _cw = w);
                  });
                }

                double _staticX(double W) {
                  final cw0 = _s.contentWidth > 50 ? _s.contentWidth : _cw;
                  final c = W / 2 - cw0 / 2;
                  return widget.side == TabletSide.right ? c - W : c;
                }

                void _toggle() {
                  if (widget.side == TabletSide.right) return;
                  setState(() => _po = !_po);
                  _po ? _pc.forward() : _pc.reverse();
                }

                Future<void> _apply(CheerSettings n) async {
                  setState(() => _s = n);
                  await Future.delayed(const Duration(milliseconds: 50));
                  _measure();
                  await Future.delayed(const Duration(milliseconds: 100));
                  final withW = n.copyWith(
                    contentWidth: _cw,
                    startTimeMs: DateTime.now().millisecondsSinceEpoch,
                  );
                  setState(() => _s = withW);
                  await widget.service.sendSettings(withW);
                }

                @override
                Widget build(BuildContext context) {
                  _measure();
                  final W = MediaQuery.of(context).size.width;
                  final cw = _s.contentWidth > 50 ? _s.contentWidth : _cw;
                  final cyc = cw + _s.repeatGap;
                  final copies = (W / cyc).ceil() + 4;

                  return Scaffold(
                    backgroundColor: _s.bgColorValue,
                    body: GestureDetector(
                      behavior: HitTestBehavior.opaque,
                      onTap: _toggle,
                      child: Stack(
                        children: [
                          if (_s.bgImageBase64 != null && _s.bgImageBase64!.isNotEmpty)
                            Positioned.fill(child: Center(child: _BgImg(s: _s))),
                          Positioned(left: -99999, top: 0, bottom: 0, child: Center(child: _Cnt(key: _ck, s: _s))),
                          ClipRect(
                            child: SizedBox.expand(
                              child: _s.scrolling
                                  ? Stack(
                                      children: List.generate(copies, (k) {
                                        double x = _sp + (k - 1) * cyc;
                                        return Positioned(left: x, top: 0, bottom: 0, child: Center(child: _Cnt(s: _s)));
                                      }),
                                    )
                                  : Stack(
                                      children: [Positioned(left: _staticX(W), top: 0, bottom: 0, child: Center(child: _Cnt(s: _s)))],
                                    ),
                            ),
                          ),
                          if (_po && widget.side == TabletSide.left)
                            Positioned(top: 12, left: 12, child: _Bdg(conn: _conn, side: widget.side)),
                          if (_conn == 0 && !_po && widget.side == TabletSide.left)
                            IgnorePointer(
                              child: Center(
                                child: Column(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    Text('📢 오른쪽 태블릿 앱을 실행해 주세요...', style: TextStyle(color: Colors.white.withOpacity(0.25), fontSize: 16, fontWeight: FontWeight.bold)),
                                    const SizedBox(height: 4),
                                    Text('위치 선택 → 오른쪽 태블릿 선택', style: TextStyle(color: Colors.white.withOpacity(0.15), fontSize: 12)),
                                  ],
                                ),
                              ),
                            ),
                          if (widget.side == TabletSide.left)
                            SlideTransition(
                              position: _ps,
                              child: Align(
                                alignment: Alignment.bottomCenter,
                                child: _Panel(
                                  s: _s, conn: _conn, screenH: MediaQuery.of(context).size.height,
                                  onClose: _toggle, onApply: _apply,
                                ),
                              ),
                            ),
                        ],
                      ),
                    ),
                  );
                }
              }

              class _BgImg extends StatelessWidget {
                final CheerSettings s;
                const _BgImg({required this.s});
                @override
                Widget build(BuildContext context) {
                  final sz = MediaQuery.of(context).size;
                  try {
                    final bytes = base64Decode(s.bgImageBase64!);
                    final w = sz.width * (s.bgImageScale / 100);
                    final h = sz.height * (s.bgImageScale / 100);
                    return Opacity(
                      opacity: s.bgImageOpacity,
                      child: Image.memory(bytes, width: w, height: h, fit: BoxFit.contain, gaplessPlayback: true,
                          errorBuilder: (_, __, ___) => const SizedBox.shrink()),
                    );
                  } catch (_) { return const SizedBox.shrink(); }
                }
              }

              class _Cnt extends StatelessWidget {
                final CheerSettings s;
                const _Cnt({super.key, required this.s});
                @override
                Widget build(BuildContext context) {
                  final imgH = MediaQuery.of(context).size.height * (s.imageSizePct / 100);
                  Widget? img;
                  if (s.imageBase64 != null && s.imageBase64!.isNotEmpty) {
                    try {
                      img = Opacity(
                        opacity: s.imageOpacity,
                        child: Image.memory(base64Decode(s.imageBase64!), height: imgH, fit: BoxFit.contain, gaplessPlayback: true,
                            errorBuilder: (_, __, ___) => const SizedBox.shrink()),
                      );
                    } catch (_) {}
                  }
                  final Widget textW = s.strokeWidth > 0
                      ? Stack(
                          alignment: Alignment.center,
                          children: [
                            Text(s.text, textAlign: TextAlign.center, style: TextStyle(
                              fontWeight: FontWeight.w900, fontSize: s.fontSize, letterSpacing: 3,
                              foreground: Paint()
                                ..style = PaintingStyle.stroke
                                ..strokeWidth = s.strokeWidth
                                ..strokeJoin = StrokeJoin.round
                                ..color = s.strokeColorValue,
                            )),
                            Text(s.text, textAlign: TextAlign.center, style: s.displayTextStyle),
                          ],
                        )
                      : Text(s.text, textAlign: TextAlign.center, style: s.displayTextStyle);

                  return Row(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.center,
                    children: [
                      if (img != null && s.imagePosition == 'before') ...[img, const SizedBox(width: 36)],
                      textW,
                      if (img != null && s.imagePosition == 'after') ...[const SizedBox(width: 36), img],
                    ],
                  );
                }
              }

