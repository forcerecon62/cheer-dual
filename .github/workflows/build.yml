w('project/lib/screens/display_screen.dart', r"""
    import 'dart:async'; import 'dart:convert'; import 'dart:typed_data';
    import 'package:flutter/material.dart'; import 'package:flutter/services.dart';
    import 'package:flutter_colorpicker/flutter_colorpicker.dart';
    import 'package:image_picker/image_picker.dart';
    import '../models/cheer_settings.dart'; import '../services/nearby_service.dart'; import '../services/image_processor.dart';

    class DisplayScreen extends StatefulWidget {
      final NearbyService service; final TabletSide side;
      const DisplayScreen({super.key, required this.service, required this.side});
      @override State<DisplayScreen> createState() => _DS();
    }
    class _DS extends State<DisplayScreen> with TickerProviderStateMixin {
      CheerSettings _s = CheerSettings.initial();
      late AnimationController _pc; late Animation<Offset> _ps; bool _po = false;
      late Ticker _ticker; double _sp = 0, _cw = 600; final _ck = GlobalKey();
      bool _blink = true; Timer? _bt; int _conn = 0;
      StreamSubscription? _ss, _cs;
      @override void initState() {
        super.initState();
        _pc = AnimationController(vsync:this, duration:const Duration(milliseconds:300));
        _ps = Tween<Offset>(begin:const Offset(0,1), end:Offset.zero).animate(CurvedAnimation(parent:_pc, curve:Curves.easeOutCubic));
        _ticker = createTicker(_tick)..start();
        _ss = widget.service.settingsStream.listen((s){setState(()=>_s=s);_rb();});
        widget.service.statusStream.listen((_){});
        _cs = widget.service.connCountStream.listen((c)=>setState(()=>_conn=c));
        widget.service.start();
        SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
      }
      @override void dispose() { _pc.dispose();_ticker.dispose();_bt?.cancel();_ss?.cancel();_cs?.cancel();widget.service.dispose();super.dispose(); }
      void _tick(Duration _) {
        if (!_s.scrolling||!mounted) return;
        final W = MediaQuery.of(context).size.width;
        final travel = W*2+_cw+40;
        final elapsed = (DateTime.now().millisecondsSinceEpoch-_s.startTimeMs)/1000.0;
        final dist = (elapsed*_s.speed)%travel;
        final absX = _s.direction=='left' ? W*2+20-dist : dist-_cw-20;
        setState(()=>_sp=absX-(widget.side==TabletSide.right?W:0));
      }
      void _rb() { _bt?.cancel(); if (!_s.blinking){setState(()=>_blink=true);return;} _bt=Timer.periodic(Duration(milliseconds:_s.blinkSpeedMs),(_)=>setState(()=>_blink=!_blink)); }
      void _measure() { WidgetsBinding.instance.addPostFrameCallback((_){ final w=_ck.currentContext?.size?.width??_cw; if(w>0&&w!=_cw)setState(()=>_cw=w); }); }
      double _sx(double W) { final c=W-_cw/2; return widget.side==TabletSide.right?c-W:c; }
      void _toggle() { setState(()=>_po=!_po); _po?_pc.forward():_pc.reverse(); }
      Future<void> _apply(CheerSettings n) async { setState(()=>_s=n);_rb();await widget.service.sendSettings(n); }
      @override Widget build(BuildContext context) {
        _measure();
        final W = MediaQuery.of(context).size.width;
        final x = _s.scrolling?_sp:_sx(W);
        return Scaffold(backgroundColor:_s.bgColorValue, body:GestureDetector(behavior:HitTestBehavior.opaque, onTap:_po?null:_toggle,
          child:Stack(children:[
            Positioned(left:-99999,top:0,child:_Cnt(key:_ck,s:_s)),
            ClipRect(child:SizedBox.expand(child:Opacity(opacity:_blink?1.0:0.0, child:Stack(children:[Positioned(left:x,top:0,bottom:0,child:Center(child:_Cnt(s:_s)))])))),
            Positioned(top:12,left:12,child:_Bdg(conn:_conn,side:widget.side)),
            if (_conn==0&&!_po) IgnorePointer(child:Center(child:Text(widget.side==TabletSide.left?'\uD83D\uDCE1 \uc624\ub978\ucabd \ud0dc\ube14\ub9bf \ub300\uae30 \uc911...':'\uD83D\uDD0D \uc67c\ucabd \ud0dc\ube14\ub9bf \uac80\uc0c9 \uc911...', style:TextStyle(color:Colors.white.withOpacity(0.25),fontSize:16,fontWeight:FontWeight.bold)))),
            SlideTransition(position:_ps, child:Align(alignment:Alignment.bottomCenter, child:_Panel(s:_s,conn:_conn,onClose:_toggle,onApply:_apply))),
          ])));
      }
    }
    class _Cnt extends StatelessWidget {
      final CheerSettings s; const _Cnt({super.key, required this.s});
      @override Widget build(BuildContext context) {
        Widget? img;
        if (s.imageBase64!=null) img=Opacity(opacity:s.imageOpacity, child:Image.memory(base64Decode(s.imageBase64!), height:MediaQuery.of(context).size.height*(s.imageSizePct/100), fit:BoxFit.contain));
        return Row(mainAxisSize:MainAxisSize.min, crossAxisAlignment:CrossAxisAlignment.center, children:[
