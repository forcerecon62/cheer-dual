name: 듀얼 응원 APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Flutter 프로젝트 기본 구조 생성
        run: flutter create --org com.cheer.dual --project-name cheer_dual --platforms android project

      - name: 소스 코드 생성
        run: |
          cat << 'EOF' > /tmp/gen.py
          import os, textwrap, re

          def w(path, txt):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              content = textwrap.dedent(txt).strip() + '\n'
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)

          w('project/pubspec.yaml', """
              name: cheer_dual
              description: Dual Tablet Cheer App
              publish_to: 'none'
              version: 1.0.0+1
              environment:
                sdk: '>=3.0.0 <4.0.0'
              dependencies:
                flutter:
                  sdk: flutter
                nearby_connections: ^4.0.0
                image_picker: ^1.0.7
                image: ^4.1.3
                permission_handler: ^11.3.0
                flutter_colorpicker: ^1.0.0
              dev_dependencies:
                flutter_test:
                  sdk: flutter
                flutter_lints: ^3.0.0
              flutter:
                uses-material-design: true
              """)

          w('project/android/app/src/main/AndroidManifest.xml', """
              <manifest xmlns:android="http://schemas.android.com/apk/res/android"
                  xmlns:tools="http://schemas.android.com/tools">
                  <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
                  <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>
                  <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
                  <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES"
                      android:usesPermissionFlags="neverForLocation" tools:targetApi="tiramisu"/>
                  <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
                  <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
                  <uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>
                  <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
                  <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE"/>
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
                  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
                  <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
                  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
                  <application android:label="듀얼 응원" android:name="${applicationName}" android:icon="@mipmap/ic_launcher">
                      <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop"
                          android:screenOrientation="landscape" android:theme="@style/LaunchTheme"
                          android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                          android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                          <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme"/>
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN"/>
                              <category android:name="android.intent.category.LAUNCHER"/>
                          </intent-filter>
                      </activity>
                      <meta-data android:name="flutterEmbedding" android:value="2"/>
                  </application>
              </manifest>
              """)

          w('project/lib/main.dart', """
              import 'package:flutter/material.dart';
              import 'package:flutter/services.dart';
              import 'screens/home_screen.dart';
              void main() {
                WidgetsFlutterBinding.ensureInitialized();
                SystemChrome.setPreferredOrientations([DeviceOrientation.landscapeLeft, DeviceOrientation.landscapeRight]);
                runApp(const CheerApp());
              }
              class CheerApp extends StatelessWidget {
                const CheerApp({super.key});
                @override
                Widget build(BuildContext context) {
                  return MaterialApp(
                    title: '듀얼 응원',
                    debugShowCheckedModeBanner: false,
                    theme: ThemeData.dark().copyWith(
                      scaffoldBackgroundColor: const Color(0xFF0B0B15),
                      sliderTheme: const SliderThemeData(
                        thumbColor: Color(0xFFFF6600),
                        activeTrackColor: Color(0xFFFF6600),
                        inactiveTrackColor: Color(0xFF333344),
                      ),
                    ),
                    home: const HomeScreen(),
                  );
                }
              }
              """)

          w('project/lib/models/cheer_settings.dart', """
              import 'dart:convert';
              import 'package:flutter/material.dart';
              class CheerSettings {
                final String text, textColor, bgColor, direction;
                final double fontSize, speed, imageOpacity, imageSizePct;
                final double contentWidth, repeatGap, strokeWidth, syncOffsetPx;
                final String strokeColor;
                final bool scrolling;
                final int startTimeMs, version;
                final String? imageBase64;
                final String imageEffect, imagePosition;
                final String? bgImageBase64;
                final double bgImageOpacity, bgImageScale;

                const CheerSettings({
                  this.text = '대구 FC 승리한다!',
                  this.textColor = '#FF6600',
                  this.bgColor = '#000000',
                  this.fontSize = 150,
                  this.scrolling = true,
                  this.direction = 'left',
                  this.speed = 300,
                  this.imageBase64,
                  this.imageEffect = 'none',
                  this.imageOpacity = 1.0,
                  this.imagePosition = 'after',
                  this.imageSizePct = 60,
                  this.contentWidth = 0,
                  this.repeatGap = 200,
                  this.strokeColor = '#000000',
                  this.strokeWidth = 0.0,
                  this.syncOffsetPx = 0.0,
                  this.bgImageBase64,
                  this.bgImageOpacity = 0.4,
                  this.bgImageScale = 100.0,
                  this.startTimeMs = 0,
                  this.version = 0,
                });

                factory CheerSettings.initial() => CheerSettings(startTimeMs: DateTime.now().millisecondsSinceEpoch);

                factory CheerSettings.fromJson(Map<String, dynamic> j) => CheerSettings(
                  text: j['text'] ?? '',
                  textColor: j['textColor'] ?? '#FF6600',
                  bgColor: j['bgColor'] ?? '#000000',
                  fontSize: ((j['fontSize'] ?? 150) as num).toDouble(),
                  scrolling: j['scrolling'] ?? true,
                  direction: j['direction'] ?? 'left',
                  speed: ((j['speed'] ?? 300) as num).toDouble(),
                  imageBase64: j['imageBase64'],
                  imageEffect: j['imageEffect'] ?? 'none',
                  imageOpacity: ((j['imageOpacity'] ?? 1.0) as num).toDouble(),
                  imagePosition: j['imagePosition'] ?? 'after',
                  imageSizePct: ((j['imageSizePct'] ?? 60) as num).toDouble(),
                  contentWidth: ((j['contentWidth'] ?? 0) as num).toDouble(),
                  repeatGap: ((j['repeatGap'] ?? 200) as num).toDouble(),
                  strokeColor: j['strokeColor'] ?? '#000000',
                  strokeWidth: ((j['strokeWidth'] ?? 0.0) as num).toDouble(),
                  syncOffsetPx: ((j['syncOffsetPx'] ?? 0.0) as num).toDouble(),
                  bgImageBase64: j['bgImageBase64'],
                  bgImageOpacity: ((j['bgImageOpacity'] ?? 0.4) as num).toDouble(),
                  bgImageScale: ((j['bgImageScale'] ?? 100.0) as num).toDouble(),
                  startTimeMs: j['startTimeMs'] ?? 0,
                  version: j['version'] ?? 0,
                );

                Map<String, dynamic> toJson() => {
                  'text': text, 'textColor': textColor, 'bgColor': bgColor,
                  'fontSize': fontSize, 'scrolling': scrolling,
                  'direction': direction, 'speed': speed,
                  'imageBase64': imageBase64, 'imageEffect': imageEffect,
                  'imageOpacity': imageOpacity, 'imagePosition': imagePosition,
                  'imageSizePct': imageSizePct, 'contentWidth': contentWidth,
                  'repeatGap': repeatGap, 'strokeColor': strokeColor, 'strokeWidth': strokeWidth,
                  'syncOffsetPx': syncOffsetPx, 'startTimeMs': startTimeMs, 'version': version,
                };

                String toJsonString() => jsonEncode(toJson());
                static CheerSettings fromJsonString(String s) => CheerSettings.fromJson(jsonDecode(s) as Map<String, dynamic>);

                CheerSettings copyWith({
                  String? text, String? textColor, String? bgColor,
                  double? fontSize, bool? scrolling, String? direction, double? speed,
                  String? imageBase64, bool clearImage = false,
                  String? imageEffect, double? imageOpacity,
                  String? imagePosition, double? imageSizePct,
                  double? contentWidth, double? repeatGap,
                  String? strokeColor, double? strokeWidth, double? syncOffsetPx,
                  String? bgImageBase64, bool clearBgImage = false,
                  double? bgImageOpacity, double? bgImageScale,
                  int? startTimeMs, int? version,
                }) => CheerSettings(
                  text: text ?? this.text,
                  textColor: textColor ?? this.textColor,
                  bgColor: bgColor ?? this.bgColor,
                  fontSize: fontSize ?? this.fontSize,
                  scrolling: scrolling ?? this.scrolling,
                  direction: direction ?? this.direction,
                  speed: speed ?? this.speed,
                  imageBase64: clearImage ? null : (imageBase64 ?? this.imageBase64),
                  imageEffect: imageEffect ?? this.imageEffect,
                  imageOpacity: imageOpacity ?? this.imageOpacity,
                  imagePosition: imagePosition ?? this.imagePosition,
                  imageSizePct: imageSizePct ?? this.imageSizePct,
                  contentWidth: contentWidth ?? this.contentWidth,
                  repeatGap: repeatGap ?? this.repeatGap,
                  strokeColor: strokeColor ?? this.strokeColor,
                  strokeWidth: strokeWidth ?? this.strokeWidth,
                  syncOffsetPx: syncOffsetPx ?? this.syncOffsetPx,
                  bgImageBase64: clearBgImage ? null : (bgImageBase64 ?? this.bgImageBase64),
                  bgImageOpacity: bgImageOpacity ?? this.bgImageOpacity,
                  bgImageScale: bgImageScale ?? this.bgImageScale,
                  startTimeMs: startTimeMs ?? this.startTimeMs,
                  version: version ?? this.version,
                );

                Color get textColorValue => hexToColor(textColor);
                Color get bgColorValue => hexToColor(bgColor);
                Color get strokeColorValue => hexToColor(strokeColor);

                static Color hexToColor(String h) {
                  final c = h.replaceAll('#', '').padLeft(6, '0');
                  return Color(int.parse('FF$c', radix: 16));
                }
                static String colorToHex(Color c) =>
                    '#${c.red.toRadixString(16).padLeft(2, '0')}${c.green.toRadixString(16).padLeft(2, '0')}${c.blue.toRadixString(16).padLeft(2, '0')}';

                TextStyle get displayTextStyle => TextStyle(
                  fontWeight: FontWeight.w900, fontSize: fontSize,
                  color: textColorValue, letterSpacing: 3,
                  shadows: [Shadow(color: textColorValue.withOpacity(0.6), blurRadius: 40)],
                );
              }
              """)

          w('project/lib/services/nearby_service.dart', """
              import 'dart:async';
              import 'dart:convert';
              import 'dart:typed_data';
              import 'package:nearby_connections/nearby_connections.dart';
              import '../models/cheer_settings.dart';

              enum TabletSide { left, right }

              class NearbyService {
                static const _sid = 'com.cheer.dual.app';
                final TabletSide side;
                final _n = Nearby();
                final _ids = <String>{};
                final _sc = StreamController<CheerSettings>.broadcast();
                final _stc = StreamController<String>.broadcast();
                final _cc = StreamController<int>.broadcast();

                Stream<CheerSettings> get settingsStream => _sc.stream;
                Stream<String> get statusStream => _stc.stream;
                Stream<int> get connCountStream => _cc.stream;

                NearbyService({required this.side});

                Future<void> start() async {
                  side == TabletSide.left ? await _adv() : await _disc();
                }

                Future<void> _adv() async {
                  try {
                    await _n.startAdvertising('LEFT', Strategy.P2P_POINT_TO_POINT,
                        onConnectionInitiated: _oi, onConnectionResult: _or,
                        onDisconnected: _od, serviceId: _sid);
                    _log('HOST 대기중...');
                  } catch (e) { _log('ERR: $e'); }
                }

                Future<void> _disc() async {
                  try {
                    await _n.startDiscovery('RIGHT', Strategy.P2P_POINT_TO_POINT,
                        onEndpointFound: (id, name, s) async {
                          try {
                            await _n.requestConnection('RIGHT', id,
                                onConnectionInitiated: _oi,
                                onConnectionResult: _or,
                                onDisconnected: _od);
                          } catch (_) {}
                        },
                        onEndpointLost: (_) {},
                        serviceId: _sid);
                    _log('CLIENT 연결중...');
                  } catch (e) { _log('ERR: $e'); }
                }

                void _oi(String id, ConnectionInfo i) {
                  _n.acceptConnection(id, onPayloadReceived: _op, onPayloadTransferUpdate: (_, __) {});
                }

                void _or(String id, Status s) {
                  if (s == Status.CONNECTED) { _ids.add(id); _log('연결되었습니다.'); }
                  else _ids.remove(id);
                  if (!_cc.isClosed) _cc.add(_ids.length);
                }

                void _od(String id) {
                  _ids.remove(id);
                  if (!_cc.isClosed) _cc.add(_ids.length);
                }

                void _op(String _, Payload p) {
                  if (p.type == PayloadType.BYTES && p.bytes != null) {
                    try { _sc.add(CheerSettings.fromJsonString(utf8.decode(p.bytes!))); } catch (_) {}
                  }
                }

                Future<bool> sendSettings(CheerSettings s) async {
                  if (_ids.isEmpty) return false;
                  final b = Uint8List.fromList(utf8.encode(s.toJsonString()));
                  for (final id in Set.of(_ids)) {
                    try { await _n.sendBytesPayload(id, b); } catch (_) {}
                  }
                  return true;
                }

                Future<void> stop() async {
                  try { await _n.stopAdvertising(); await _n.stopDiscovery(); await _n.stopAllEndpoints(); } catch (_) {}
                  _ids.clear();
                  if (!_cc.isClosed) _cc.add(0);
                }

                void dispose() { stop(); _sc.close(); _stc.close(); _cc.close(); }
                void _log(String m) { if (!_stc.isClosed) _stc.add(m); }
              }
              """)

          w('project/lib/services/image_processor.dart', """
              import 'dart:math';
              import 'dart:typed_data';
              import 'package:image/image.dart' as img;

              class ImageProcessor {
                static Future<Uint8List> compress(Uint8List raw, {int quality = 55, int maxSize = 500}) async {
                  final d = img.decodeImage(raw); if (d == null) return raw;
                  img.Image r = d;
                  if (d.width > maxSize || d.height > maxSize) {
                    final ratio = min(maxSize / d.width, maxSize / d.height);
                    r = img.copyResize(d, width: (d.width * ratio).round(), height: (d.height * ratio).round(), interpolation: img.Interpolation.linear);
                  }
                  return Uint8List.fromList(img.encodeJpg(r, quality: quality));
                }

                static Future<Uint8List> compressBg(Uint8List raw) async {
                  final d = img.decodeImage(raw); if (d == null) return raw;
                  img.Image r = d;
                  const maxSize = 900;
                  if (d.width > maxSize || d.height > maxSize) {
                    final ratio = min(maxSize / d.width, maxSize / d.height);
                    r = img.copyResize(d, width: (d.width * ratio).round(), height: (d.height * ratio).round(), interpolation: img.Interpolation.linear);
                  }
                  return Uint8List.fromList(img.encodeJpg(r, quality: 70));
                }

                static Future<Uint8List> sobelEdge(Uint8List raw, {int maxSz = 450, double thr = 22.0}) async {
                  final d = img.decodeImage(raw); if (d == null) return raw;
                  img.Image s = d;
                  if (s.width > maxSz || s.height > maxSz) {
                    final r = min(maxSz / s.width, maxSz / s.height);
                    s = img.copyResize(d, width: (s.width * r).round(), height: (s.height * r).round(), interpolation: img.Interpolation.linear);
                  }
                  final w = s.width; final h = s.height;
                  final g = List<double>.filled(w * h, 0.0);
                  for (int y = 0; y < h; y++) {
                    for (int x = 0; x < w; x++) {
                      final p = s.getPixel(x, y);
                      g[y * w + x] = 0.299 * p.r + 0.587 * p.g + 0.114 * p.b;
                    }
                  }
                  final out = img.Image(width: w, height: h, numChannels: 4);
                  for (int y = 1; y < h - 1; y++) {
                    for (int x = 1; x < w - 1; x++) {
                      double p(int dy, int dx) => g[(y + dy) * w + (x + dx)];
                      final gx = -p(-1, -1) + p(-1, 1) - 2 * p(0, -1) + 2 * p(0, 1) - p(1, -1) + p(1, 1);
                      final gy = -p(-1, -1) - 2 * p(-1, 0) - p(-1, 1) + p(1, -1) + 2 * p(1, 0) + p(1, 1);
                      if (sqrt(gx * gx + gy * gy) > thr) {
                        out.setPixelRgba(x, y, 255, 255, 255, 255);
                      } else {
                        out.setPixelRgba(x, y, 0, 0, 0, 0);
                      }
                    }
                  }
                  return Uint8List.fromList(img.encodePng(out));
                }
              }
              """)

          w('project/lib/screens/home_screen.dart', """
              import 'package:flutter/material.dart';
              import 'package:permission_handler/permission_handler.dart';
              import '../services/nearby_service.dart';
              import 'display_screen.dart';

              class HomeScreen extends StatefulWidget {
                const HomeScreen({super.key});
                @override
                State<HomeScreen> createState() => _HS();
              }

              class _HS extends State<HomeScreen> {
                TabletSide? _side;
                bool _loading = false;
                static const _o = Color(0xFFFF6600);

                Future<void> _start() async {
                  if (_side == null || _loading) return;
                  setState(() => _loading = true);
                  await [
                    Permission.locationWhenInUse,
                    Permission.nearbyWifiDevices,
                    Permission.bluetoothScan,
                    Permission.bluetoothConnect,
                    Permission.bluetoothAdvertise,
                    Permission.photos,
                  ].request();
                  if (!mounted) return;
                  Navigator.pushReplacement(context, MaterialPageRoute(
                      builder: (_) => DisplayScreen(service: NearbyService(side: _side!), side: _side!)));
                }

                @override
                Widget build(BuildContext context) {
                  return Scaffold(
                    backgroundColor: const Color(0xFF0B0B15),
                    body: SafeArea(
                      child: SingleChildScrollView(
                        padding: const EdgeInsets.all(28),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text('⚽ 듀얼 응원 전광판', style: TextStyle(fontSize: 26, fontWeight: FontWeight.w900, color: _o)),
                            const SizedBox(height: 4),
                            Text('WiFi Direct 연동 • 전광판 동기화 시스템', style: TextStyle(color: Colors.grey[600], fontSize: 12)),
                            const SizedBox(height: 36),
                            const Text('위치 선택 (장치 역할)', style: TextStyle(color: _o, fontWeight: FontWeight.bold, fontSize: 14)),
                            const SizedBox(height: 14),
                            Row(
                              children: [
                                _roleBtn('◀ 왼쪽 태블릿', '마스터 콘트롤 패널 HOST', const Color(0xFF3366FF),
                                    _side == TabletSide.left, () => setState(() => _side = TabletSide.left)),
                                const SizedBox(width: 14),
                                _roleBtn('오른쪽 태블릿 ▶', '화면 동기화 CLIENT', _o,
                                    _side == TabletSide.right, () => setState(() => _side = TabletSide.right)),
                              ],
                            ),
                            const SizedBox(height: 16),
                            Container(
                              padding: const EdgeInsets.all(14),
                              decoration: BoxDecoration(color: const Color(0xFF1A1A2E), borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.white10)),
                              child: Text(
                                '1. 양쪽 태블릿 기기 WiFi 및 블루투스 활성화 필요\n2. 마스터(왼쪽) 기기에서 설정을 변경하면 동기화 정보가 즉시 전송됩니다.\n3. 동기화 오프셋 제어를 통해 디스플레이 싱크 수동 보정 가능',
                                style: TextStyle(color: Colors.grey[600], fontSize: 12, height: 1.7),
                              ),
                            ),
                            const SizedBox(height: 28),
                            SizedBox(
                              width: double.infinity,
                              child: ElevatedButton(
                                onPressed: (_side != null && !_loading) ? _start : null,
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: _o, disabledBackgroundColor: Colors.grey[800],
                                  padding: const EdgeInsets.symmetric(vertical: 18),
                                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                                ),
                                child: _loading
                                    ? const SizedBox(width: 24, height: 24, child: CircularProgressIndicator(color: Colors.white, strokeWidth: 2.5))
                                    : Text(_side == null ? '태블릿 위치를 선택해주세요' : '전광판 시작하기 🚀',
                                        style: const TextStyle(fontSize: 17, fontWeight: FontWeight.w900, color: Colors.white)),
