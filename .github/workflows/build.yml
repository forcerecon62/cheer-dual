                  child: Container(
                    padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 11),
                    decoration: BoxDecoration(color: const Color(0xFF12121C), borderRadius: BorderRadius.circular(10), border: Border.all(color: const Color(0xFF2A2A3A))),
                    child: Row(children: [
