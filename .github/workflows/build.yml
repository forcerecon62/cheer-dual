                Widget _sl(String label, double val, double min, double max, ValueChanged<double> cb) => Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                  Text(label, style: const TextStyle(color: Colors.grey, fontSize: 11)),
                  Slider(value: val.clamp(min, max), min: min, max: max, onChanged: cb),
