name: 듀얼 응원 APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Flutter 프로젝트 기본 구조 생성
        run: flutter create --org com.cheer.dual --project-name cheer_dual --platforms android project

      - name: 소스 코드 생성
        run: |
          echo "  " | base64 -d > /tmp/gen.py
          python3 /tmp/gen.py

      - name: 패키지 설치
        run: cd project && flutter pub get

      - name: APK 빌드
        run: cd project && flutter build apk --release --target-platform android-arm64 --no-shrink

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 듀얼응원앱-APK
          path: project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
