w('project/lib/models/cheer_settings.dart', r"""
    import 'dart:convert';
    import 'package:flutter/material.dart';
    class CheerSettings {
      final String text, textColor, bgColor, fontFamily, direction, imageEffect, imagePosition;
      final double fontSize, speed, imageOpacity, imageSizePct;
      final bool scrolling, blinking;
      final int blinkSpeedMs, startTimeMs, version;
      final String? imageBase64;
      const CheerSettings({
        this.text = '\ub300\uad6c FC \ud30c\uc774\ud305!',
        this.textColor = '#FF6600', this.bgColor = '#000022', this.fontFamily = 'Impact',
        this.fontSize = 88, this.scrolling = true, this.direction = 'left', this.speed = 300,
        this.blinking = false, this.blinkSpeedMs = 600, this.imageBase64,
        this.imageEffect = 'none', this.imageOpacity = 1.0,
        this.imagePosition = 'after', this.imageSizePct = 60,
        this.startTimeMs = 0, this.version = 0,
      });
      factory CheerSettings.initial() => CheerSettings(startTimeMs: DateTime.now().millisecondsSinceEpoch);
      factory CheerSettings.fromJson(Map<String, dynamic> j) => CheerSettings(
        text: j['text'] ?? '', textColor: j['textColor'] ?? '#FF6600', bgColor: j['bgColor'] ?? '#000022',
        fontFamily: j['fontFamily'] ?? 'Impact', fontSize: ((j['fontSize'] ?? 88) as num).toDouble(),
        scrolling: j['scrolling'] ?? true, direction: j['direction'] ?? 'left',
        speed: ((j['speed'] ?? 300) as num).toDouble(), blinking: j['blinking'] ?? false,
        blinkSpeedMs: j['blinkSpeedMs'] ?? 600, imageBase64: j['imageBase64'],
        imageEffect: j['imageEffect'] ?? 'none', imageOpacity: ((j['imageOpacity'] ?? 1.0) as num).toDouble(),
        imagePosition: j['imagePosition'] ?? 'after', imageSizePct: ((j['imageSizePct'] ?? 60) as num).toDouble(),
        startTimeMs: j['startTimeMs'] ?? 0, version: j['version'] ?? 0,
      );
      Map<String, dynamic> toJson() => {
        'text': text, 'textColor': textColor, 'bgColor': bgColor, 'fontFamily': fontFamily,
        'fontSize': fontSize, 'scrolling': scrolling, 'direction': direction, 'speed': speed,
        'blinking': blinking, 'blinkSpeedMs': blinkSpeedMs, 'imageBase64': imageBase64,
        'imageEffect': imageEffect, 'imageOpacity': imageOpacity, 'imagePosition': imagePosition,
        'imageSizePct': imageSizePct, 'startTimeMs': startTimeMs, 'version': version,
      };
      String toJsonString() => jsonEncode(toJson());
      static CheerSettings fromJsonString(String s) => CheerSettings.fromJson(jsonDecode(s) as Map<String, dynamic>);
      CheerSettings copyWith({
        String? text, String? textColor, String? bgColor, String? fontFamily,
        double? fontSize, bool? scrolling, String? direction, double? speed,
        bool? blinking, int? blinkSpeedMs, String? imageBase64, bool clearImage = false,
        String? imageEffect, double? imageOpacity, String? imagePosition,
        double? imageSizePct, int? startTimeMs, int? version,
      }) => CheerSettings(
        text: text ?? this.text, textColor: textColor ?? this.textColor, bgColor: bgColor ?? this.bgColor,
        fontFamily: fontFamily ?? this.fontFamily, fontSize: fontSize ?? this.fontSize,
        scrolling: scrolling ?? this.scrolling, direction: direction ?? this.direction, speed: speed ?? this.speed,
        blinking: blinking ?? this.blinking, blinkSpeedMs: blinkSpeedMs ?? this.blinkSpeedMs,
        imageBase64: clearImage ? null : (imageBase64 ?? this.imageBase64),
        imageEffect: imageEffect ?? this.imageEffect, imageOpacity: imageOpacity ?? this.imageOpacity,
        imagePosition: imagePosition ?? this.imagePosition, imageSizePct: imageSizePct ?? this.imageSizePct,
        startTimeMs: startTimeMs ?? this.startTimeMs, version: version ?? this.version,
      );
      Color get textColorValue => _hex(textColor);
      Color get bgColorValue => _hex(bgColor);
      static Color _hex(String h) { final c = h.replaceAll('#','').padLeft(6,'0'); return Color(int.parse('FF$c', radix:16)); }
      static String colorToHex(Color c) => '#${c.red.toRadixString(16).padLeft(2,'0')}${c.green.toRadixString(16).padLeft(2,'0')}${c.blue.toRadixString(16).padLeft(2,'0')}';
      static const fontOptions = [
        {'label':'Impact','value':'Impact'}, {'label':'\ub9d1\uc740\uace0\ub515','value':'MalgunGothic'},
        {'label':'\ubc14\ud0d5','value':'Batang'}, {'label':'\ub3cb\uc6c0','value':'Dotum'}, {'label':'Sans-serif','value':'sans-serif'},
      ];
      TextStyle get displayTextStyle => TextStyle(fontFamily: fontFamily, fontWeight: FontWeight.w900, fontSize: fontSize, color: textColorValue, letterSpacing: 4, shadows: [Shadow(color: textColorValue.withOpacity(0.5), blurRadius: 30)]);
    }
    """)

w('project/lib/services/nearby_service.dart', r"""
    import 'dart:async';
    import 'dart:typed_data';
    import 'package:nearby_connections/nearby_connections.dart';
    import '../models/cheer_settings.dart';
    enum ConnType { wifiDirect, bluetooth }
    enum TabletSide { left, right }
    class NearbyService {
      static const _sid = 'com.cheer.dual.app';
      final ConnType connType; final TabletSide side;
      final _n = Nearby(); final _ids = <String>{};
      final _sc = StreamController<CheerSettings>.broadcast();
      final _stc = StreamController<String>.broadcast();
      final _cc = StreamController<int>.broadcast();
      Stream<CheerSettings> get settingsStream => _sc.stream;
      Stream<String> get statusStream => _stc.stream;
      Stream<int> get connCountStream => _cc.stream;
      NearbyService({required this.connType, required this.side});
      Future<void> start() async { side == TabletSide.left ? await _adv() : await _disc(); }
      Future<void> _adv() async {
        try { await _n.startAdvertising('LEFT', Strategy.P2P_POINT_TO_POINT, onConnectionInitiated: _oi, onConnectionResult: _or, onDisconnected: _od, serviceId: _sid); _log('HOST \ub300\uae30\uc911'); } catch (e) { _log('ERR $e'); }
      }
      Future<void> _disc() async {
        try {
          await _n.startDiscovery('RIGHT', Strategy.P2P_POINT_TO_POINT,
            onEndpointFound: (id, name, s) async { try { await _n.requestConnection('RIGHT', id, onConnectionInitiated: _oi, onConnectionResult: _or, onDisconnected: _od); } catch (_) {} },
            onEndpointLost: (_) {}, serviceId: _sid);
          _log('CLIENT \uac80\uc0c9\uc911');
        } catch (e) { _log('ERR $e'); }
      }
      void _oi(String id, ConnectionInfo i) { _n.acceptConnection(id, onPayLoadRecieved: _op, onPayloadTransferUpdate: (_,__) {}); }
      void _or(String id, Status s) { if (s == Status.CONNECTED) { _ids.add(id); _log('\uc5f0\uacb0\uc644\ub8cc'); } else _ids.remove(id); if (!_cc.isClosed) _cc.add(_ids.length); }
      void _od(String id) { _ids.remove(id); if (!_cc.isClosed) _cc.add(_ids.length); }
      void _op(String _, Payload p) { if (p.type == PayloadType.BYTES && p.bytes != null) { try { _sc.add(CheerSettings.fromJsonString(String.fromCharCodes(p.bytes!))); } catch (_) {} } }
      Future<bool> sendSettings(CheerSettings s) async {
        if (_ids.isEmpty) return false;
        final b = Uint8List.fromList(s.toJsonString().codeUnits);
        for (final id in Set.of(_ids)) { try { await _n.sendBytesPayload(id, b); } catch (_) {} }
        return true;
      }
      Future<void> stop() async { try { await _n.stopAdvertising(); await _n.stopDiscovery(); await _n.stopAllEndpoints(); } catch (_) {} _ids.clear(); if (!_cc.isClosed) _cc.add(0); }
      void dispose() { stop(); _sc.close(); _stc.close(); _cc.close(); }
      void _log(String m) { if (!_stc.isClosed) _stc.add(m); }
    }
    """)

w('project/lib/services/image_processor.dart', r"""
    import 'dart:math'; import 'dart:typed_data'; import 'package:image/image.dart' as img;
    class ImageProcessor {
      static Future<Uint8List> compress(Uint8List raw, {int quality=60, int maxSize=700}) async {
        final d = img.decodeImage(raw); if (d == null) return raw;
        img.Image r = d;
        if (d.width > maxSize || d.height > maxSize) { final ratio = min(maxSize/d.width, maxSize/d.height); r = img.copyResize(d, width:(d.width*ratio).round(), height:(d.height*ratio).round(), interpolation:img.Interpolation.linear); }
        return Uint8List.fromList(img.encodeJpg(r, quality: quality));
      }
      static Future<Uint8List> sobelEdge(Uint8List raw, {int maxSz=550, double thr=22}) async {
        final d = img.decodeImage(raw); if (d == null) return raw;
        img.Image s = d;
        if (s.width > maxSz || s.height > maxSz) { final r = min(maxSz/s.width, maxSz/s.height); s = img.copyResize(d, width:(s.width*r).round(), height:(s.height*r).round(), interpolation:img.Interpolation.linear); }
        final w = s.width, h = s.height;
        final g = List<double>.filled(w*h, 0.0);
        for (int y=0; y<h; y++) for (int x=0; x<w; x++) { final p = s.getPixel(x,y); g[y*w+x] = 0.299*p.r+0.587*p.g+0.114*p.b; }
        final out = img.Image(width:w, height:h, numChannels:4);
        for (int y=1; y<h-1; y++) for (int x=1; x<w-1; x++) {
          double p(int dy, int dx) => g[(y+dy)*w+(x+dx)];
          final gx = -p(-1,-1)+p(-1,1)-2*p(0,-1)+2*p(0,1)-p(1,-1)+p(1,1);
          final gy = -p(-1,-1)-2*p(-1,0)-p(-1,1)+p(1,-1)+2*p(1,0)+p(1,1);
          final mag = sqrt(gx*gx+gy*gy);
          if (mag>thr) out.setPixelRgba(x,y,255,255,255,255); else out.setPixelRgba(x,y,0,0,0,0);
        }
        return Uint8List.fromList(img.encodePng(out));
      }
    }
    """)

