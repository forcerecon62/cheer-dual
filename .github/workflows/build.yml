name: 듀얼 응원 APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Flutter 프로젝트 기본 구조 생성
        run: |
          flutter create --org com.cheer.dual --project-name cheer_dual --platforms android project

      - name: 소스 코드 생성
        run: |
          cat > /tmp/gen.py << 'PYEOF'
import os, textwrap

def w(path, txt):
    os.makedirs(os.path.dirname(path), exist_ok=True)
    content = textwrap.dedent(txt).strip() + '\n'
    with open(path, 'w', encoding='utf-8') as f:
        f.write(content)

